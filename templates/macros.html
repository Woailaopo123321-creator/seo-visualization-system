{% macro chart_card(canvas_id, title) -%}
<section class="card">
  <div class="card-head">
    <h2>{{ title }}</h2>
    <span class="badge" data-badge-for="{{ canvas_id }}"></span>
  </div>
  <p class="caption" data-caption-for="{{ canvas_id }}"></p>
  <div class="chart-box">
    <canvas id="{{ canvas_id }}" role="img" aria-label="{{ title }}"></canvas>
  </div>
</section>
{%- endmacro %}
