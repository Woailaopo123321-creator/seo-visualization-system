<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>手机控制台</title>
<style>
body{font-family:system-ui,sans-serif;background:#f1f5f9;margin:0;padding:0}
.header{background:#4f46e5;color:#fff;padding:16px;text-align:center;position:sticky;top:0}
.container{padding:12px;max-width:480px;margin:0 auto}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px}
.stat{background:#fff;border-radius:10px;padding:12px;text-align:center}
.stat-num{font-size:20px;font-weight:700;color:#4f46e5}
.card{background:#fff;border-radius:12px;padding:14px;margin-bottom:10px;display:flex;justify-content:space-between;text-decoration:none;color:inherit}
.section h2{font-size:14px;color:#64748b}
</style>
</head>
<body>
<div class="header"><h1>SEO 可视化控制台</h1></div>
<div class="container">
  <div class="stats">
    <div class="stat"><div class="stat-num">8</div><div>工作流阶段</div></div>
    <div class="stat"><div class="stat-num">4</div><div>外链工具</div></div>
    <div class="stat"><div class="stat-num">0.70</div><div>质量阈值</div></div>
    <div class="stat"><div class="stat-num">HITL</div><div>人工闸门</div></div>
  </div>
  <div class="section"><h2>核心入口</h2>
    <a class="card" href="/dashboard"><div>仪表盘</div><span>›</span></a>
  </div>
  <div class="section"><h2>外链分析</h2>
    <a class="card" href="/backlink-competitor"><div>竞品结构</div><span>›</span></a>
    <a class="card" href="/backlink-score-model"><div>评分模型</div><span>›</span></a>
  </div>
</div>
</body>
</html>
